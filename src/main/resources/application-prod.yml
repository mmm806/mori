spring:
  # 컨테이너 간 DNS 사용
  datasource:
    url: jdbc:postgresql://${DB_HOST:db-prod}:${DB_PORT:5432}/${DB_NAME:mori}
    username: ${DB_USER:raymond}
    password: ${DB_PASS:}
  jpa:
    properties:
      hibernate.format_sql: false

logging:
  level:
    org.hibernate.SQL: warn

management:
  endpoints:
    web.exposure.include: [health, info]
  endpoint:
    health.show-details: when_authorized
