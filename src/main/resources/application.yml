spring:
  application:
    name: mori
  profiles:
    default: dev        # ?? ???? ??
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    level: "%5p [rid:%X{requestId}]"
  level:
    root: info

management:
  endpoints:
    web:
      exposure:
        include: [health, info]
  endpoint:
    health:
      probes.enabled: true
